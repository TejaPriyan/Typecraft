<style>
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#07080b;--ink:#eef0f5;--dim:rgba(238,240,245,.62);--faint:rgba(238,240,245,.34);
  --line:rgba(238,240,245,.15);--glass:rgba(11,12,16,.68);--glass2:rgba(17,18,24,.86);
  --acc:#a9c6ff;--acc-ink:#05070b;--rec:#ff4d4d;
  --f-ui:'Space Grotesk',system-ui,sans-serif;--f-disp:'Unbounded','Space Grotesk',system-ui,sans-serif;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#000;color:var(--ink);font:500 13px/1.35 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#gl{position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none;outline:none;display:block;background:#000}
#hud{position:fixed;left:0;top:0;pointer-events:none}
#grainfx{display:none}
.hide{display:none!important}

/* landing */
#landing{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 20px calc(9vh + env(safe-area-inset-bottom,0px));pointer-events:none;transition:opacity .6s ease}
#landing.gone{opacity:0}
#tagline{font:600 clamp(11px,1.6vw,15px)/1 var(--f-ui);letter-spacing:calc(.34em + var(--spread,0)*.5em);text-transform:uppercase;margin:0 0 28px;color:var(--dim);text-align:center;padding-left:.34em;transition:letter-spacing .25s ease-out}
#ctas{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.cta{pointer-events:auto;border-radius:999px;padding:16px 30px;font:600 12px/1 var(--f-disp);letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--line);background:rgba(255,255,255,.04);backdrop-filter:blur(10px);transition:transform .2s ease,background .2s ease}
.cta.primary{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.cta:hover{transform:translateY(-2px)}
#landhint{margin-top:22px;color:var(--faint);font-size:12px;letter-spacing:.04em;text-align:center}
#landTop{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top,0px)) 22px 0;pointer-events:none;color:var(--faint);font-size:12px}
#landTop b{font:600 12px var(--f-disp);letter-spacing:.2em;color:var(--dim)}

/* studio ui */
#ui{position:fixed;inset:0;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .5s ease}
#ui.on{opacity:1;visibility:visible}
#ui>*{pointer-events:none}
#ui button,#ui input,#ui textarea,#ui .card,#ui .panel,#ui label{pointer-events:auto}
#top{position:fixed;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 0}
#logo{font:700 12px var(--f-disp);letter-spacing:.18em;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:11px 16px;backdrop-filter:blur(12px)}
#inputWrap{flex:1;max-width:560px;display:flex;justify-content:center}
#textIn{width:100%;resize:none;background:var(--glass);border:1px solid var(--line);border-radius:18px;color:var(--ink);padding:11px 18px;font:600 15px/1.3 var(--f-ui);letter-spacing:.06em;text-align:center;backdrop-filter:blur(12px);user-select:text;-webkit-user-select:text;height:44px;max-height:96px;overflow:hidden}
#textIn::placeholder{color:var(--faint)}
.grp{display:flex;gap:6px;align-items:center}
.btn{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:11px 15px;font:600 11px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;backdrop-filter:blur(12px);transition:background .15s,border-color .15s,transform .15s}
.btn:hover{border-color:var(--faint)}
.btn:active{transform:scale(.97)}
.btn.on{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.btn.acc{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.btn.rec{border-color:rgba(255,77,77,.5)}
.btn.rec.live{background:var(--rec);color:#fff;border-color:transparent}
.btn.rec .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rec);margin-right:8px;vertical-align:0}
.btn.rec.live .dot{background:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.btn[disabled]{opacity:.35;pointer-events:none}
#tools{position:fixed;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:6px;backdrop-filter:blur(12px)}
#tools button{background:transparent;border:0;border-radius:12px;padding:9px 12px;font:600 11px/1 var(--f-ui);letter-spacing:.1em;text-align:left;color:var(--dim);text-transform:uppercase;min-width:84px}
#tools button:hover{color:var(--ink)}
#tools button.on{background:var(--acc);color:var(--acc-ink)}
#tools .sep{height:1px;background:var(--line);margin:3px 6px}
#stack{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 10px calc(12px + env(safe-area-inset-bottom,0px))}
#stack>*{pointer-events:auto}
.panel{display:none;width:min(760px,100%);max-height:44vh;overflow:auto;background:var(--glass2);border:1px solid var(--line);border-radius:20px;padding:16px 18px;backdrop-filter:blur(18px);box-shadow:0 24px 60px rgba(0,0,0,.45)}
.panel.open{display:block;animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.sec{margin:0 0 14px}.sec:last-child{margin-bottom:0}
.lab{font:600 11px/1 var(--f-ui);color:var(--dim);margin:0 0 8px;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font:500 12px/1 var(--f-ui);color:var(--ink)}
.chip:hover{border-color:var(--faint)}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:transparent;font-weight:600}
.chip .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:-1px;border:1px solid rgba(255,255,255,.3)}
.sliders{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 22px}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12px;color:var(--dim)}
.sl output{color:var(--ink);font-variant-numeric:tabular-nums}
.sl input{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line);border-radius:2px}
input[type=range]::-moz-range-track{height:3px;background:var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--acc);margin-top:-6.5px;border:0}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--acc);border:0}
.note{font-size:12px;color:var(--faint);margin:8px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fld{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--ink);font:500 13px var(--f-ui);min-width:0;flex:1;user-select:text;-webkit-user-select:text}
#dock{display:flex;gap:4px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:6px;backdrop-filter:blur(14px);max-width:100%;overflow-x:auto;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
#dock .btn{border:0;background:transparent;backdrop-filter:none}
#dock .btn:hover{background:rgba(255,255,255,.07)}
#dock .btn.on{background:var(--acc);color:var(--acc-ink)}
#dock .btn.rec{border:1px solid rgba(255,77,77,.5)}
#dock .btn.rec.live{background:var(--rec);color:#fff}
#dock .btn.acc{background:var(--acc);color:var(--acc-ink)}
#dock .vr{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
#tl{display:none;align-items:center;gap:8px;width:min(760px,100%);background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:6px 10px;backdrop-filter:blur(14px)}
#tl.on{display:flex}
#tl .btn{padding:8px 11px;background:transparent;border:0}
#tl .btn:hover{background:rgba(255,255,255,.07)}
#tl .btn.on{background:var(--acc);color:var(--acc-ink)}
#scrubWrap{position:relative;flex:1;height:22px}
#scrub{position:absolute;inset:0}
#marks{position:absolute;left:8px;right:8px;top:0;bottom:0;pointer-events:none}
#marks i{position:absolute;top:3px;width:4px;height:4px;border-radius:50%;background:var(--acc);transform:translateX(-2px)}
#tcode{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px;min-width:74px;text-align:right}
#expPill{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;align-items:center;gap:12px;background:var(--glass2);border:1px solid var(--line);border-radius:999px;padding:10px 12px 10px 18px;z-index:60;backdrop-filter:blur(14px);font-size:12px}
#expPill.on{display:flex}
#expPill .bar{width:140px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
#expPill .bar i{display:block;height:100%;width:0;background:var(--acc)}
#toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--glass2);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(12px);z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#cursorTag{position:fixed;left:0;top:0;pointer-events:none;font:700 10px/1 var(--f-ui);letter-spacing:.14em;color:var(--ink);text-transform:uppercase;opacity:0;transition:opacity .15s;z-index:20;mix-blend-mode:difference;white-space:nowrap}
#cursorTag.on{opacity:1}
.modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);z-index:40;padding:16px}
.modal.on{display:grid}
.card{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--glass2);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.card h2{font:700 15px var(--f-disp);letter-spacing:.12em;text-transform:uppercase;margin:0 0 16px}
.card video,.card img{width:100%;max-height:46vh;object-fit:contain;border-radius:12px;background:#000;margin:0 0 14px}
.plist{display:flex;flex-direction:column;gap:6px;margin:0 0 14px;max-height:34vh;overflow:auto}
.pitem{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pitem span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem small{color:var(--faint)}
#prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:10px 0}
#prog i{display:block;height:100%;width:0;background:var(--acc)}
#result{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;gap:8px;z-index:25;background:var(--glass2);border:1px solid var(--line);border-radius:999px;padding:8px;backdrop-filter:blur(14px)}
#result.on{display:flex}
#bars{position:fixed;left:0;right:0;top:0;bottom:0;pointer-events:none;display:none;z-index:5}
#bars::before,#bars::after{content:"";position:absolute;left:0;right:0;height:9vh;background:#000}
#bars::before{top:0}#bars::after{bottom:0}
body.cinema #bars{display:block}
body.cinema #ui,body.cinema #landing,body.cinema #landTop{display:none}
body.reel #ui{opacity:0!important;pointer-events:none!important}
body.reel #ui *{pointer-events:none!important}
body.reel #landing,body.reel #landTop{display:none}
body.exporting #ui,body.exporting #landing,body.exporting #landTop,body.exporting #cursorTag{display:none}
#cinemaBar{position:fixed;left:50%;bottom:calc(14vh);transform:translateX(-50%);display:none;gap:8px;z-index:26;opacity:.0;transition:opacity .4s}
#cinemaBar.on{display:flex;opacity:1}
#demoCap{position:fixed;left:50%;bottom:calc(16vh + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font:600 13px var(--f-disp);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);background:var(--glass2);border:1px solid var(--line);padding:12px 20px;border-radius:999px;display:none;z-index:22;text-align:center;max-width:92vw}
#demoCap.on{display:block}
#fatal{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:30px;background:#000;z-index:99;font-size:15px;color:var(--dim)}
#fatal.on{display:grid}
@media (max-width:820px){
  #tools{left:0;right:0;top:auto;bottom:auto;position:static;transform:none;flex-direction:row;overflow-x:auto;width:min(760px,100%);border-radius:16px;scrollbar-width:none;flex:none}
  #tools button{min-width:0;white-space:nowrap;padding:9px 10px}
  #tools .sep{width:1px;height:auto;margin:3px 3px}
  #logo{display:none}
  #top{justify-content:center;flex-wrap:wrap}
  #top .grp{width:100%;justify-content:center}
  #toast{top:calc(118px + env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<canvas id="gl" tabindex="0" aria-label="Typography canvas. Use arrow keys to select letters, Space to impact, B to break, R to rebuild."></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<div id="bars"></div>

<div id="landTop" style="display:flex;align-items:center;gap:12px;"><b>TYPECRAFT</b><span>Move your cursor through the letters</span><a href="https://www.buymeacoffee.com/TejaPriyan" target="_blank" rel="noopener noreferrer" style="color:#FFDD00;text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:4px;margin-left:auto;pointer-events:auto;font-size:11px;background:rgba(255,221,0,0.1);padding:4px 10px;border-radius:999px;border:1px solid rgba(255,221,0,0.3);" title="Buy me a pizza">🍕 <span>Buy me a pizza</span></a></div>
<section id="landing" aria-label="Welcome">

/* ===================== GLYPHS: raster -> SDF texture, particle samples, contours ===================== */

}
function edt1d(g,off,stride,len,f,v,z){
  v[0]=0;z[0]=-INF;z[1]=INF;f[0]=g[off];
  for(let q=1,k=0,s=0;q<len;q++){

  const key=f.id+'|'+w+'|'+ch+'|'+glyphRes;

  if(/^\s$/.test(ch)){g={ch,adv,blank:true,use:performance.now()};glyphCache.set(key,g);return g}
  let xmin=-(m.actualBoundingBoxLeft||0)/M,xmax=(m.actualBoundingBoxRight||m.width)/M;
  let asc=(m.actualBoundingBoxAscent||.7*M)/M,desc=(m.actualBoundingBoxDescent||0)/M;
  if(!(xmax-xmin>.01)){xmin=0;xmax=Math.max(adv,.3)}

      case 9:link(t,b);break;case 10:link(t,r);link(l,b);break;case 11:link(t,r);break;case 12:link(l,r);break;
      case 13:link(b,r);break;case 14:link(l,b);break}

    const vert=id&1,idx=id>>1,y=Math.floor(idx/W),x=idx%W;

/* ---- text layout (pure) ---- */
function layoutText(text,cfg,view,offY){
  const f=FONT[cfg.font],w=effWeight(f,cfg.weight);
  let lines=text.split('\n');
  if(view.aspect<.85&&lines.length===1&&/\s/.test(lines[0].trim()))lines=lines[0].trim().split(/\s+/);
  const tr=cfg.tracking,capH=capHeight(f,w),lh=cfg.lineH*1.05;
  const rows=lines.map(line=>{
    const gl=Array.from(line).map(ch=>getGlyph(ch,f,w));
    let wd=0;gl.forEach((g,i)=>{wd+=g.adv+(i<gl.length-1?tr:0)});
    return{gl,wd};
  });
  const wMax=Math.max(.2,...rows.map(r=>r.wd)),totalH=(rows.length-1)*lh+capH;
  let fs=Math.min(view.W*.8*cfg.size/wMax,view.H*.6*cfg.size/totalH,view.H*.5);
  fs=Math.min(fs,view.W*.94/wMax);
  const yTop=totalH*fs/2,slots=[];
  rows.forEach((row,ri)=>{
    const base=yTop-capH*fs-ri*lh*fs+(offY||0);
    let x0=cfg.align==='left'?-wMax*fs/2:cfg.align==='right'?wMax*fs/2-row.wd*fs:-row.wd*fs/2;
    let pen=0;
    row.gl.forEach(g=>{
      if(!g.blank)slots.push({g,ch:g.ch,x:x0+(pen+g.cx)*fs,y:base+g.cy*fs,line:ri});
      pen+=g.adv+tr;
    });
  });
  return{slots,fs,capH};
}

/* voronoi cells seeded on the glyph's ink, so each shard has real material */

    const sum=seeds.map(()=>[0,0,0]);
    for(const p of pts){let b=0,bd=1e9;for(let k=0;k<K;k++){const d=(p[0]-seeds[k][0])**2+(p[1]-seeds[k][1])**2;if(d<bd){bd=d;b=k}}sum[b][0]+=p[0];sum[b][1]+=p[1];sum[b][2]++}

function pairs(){

const WALLS=[[0,1,'b',1],[0,-1,'t',-1],[1,0,'l',1],[-1,0,'r',-1]];

/* ---- shards ---- */

/* ---- impact ---- */

    this.c.obj.renderOrder=12;paintCloud(this.c);
  }

    const i=this.head;this.head=(this.head+1)%this.n;

  }
  burst(x,y,n,speed,z){

  }
  ring(x,y,r){const n=S.calm?10:34;for(let k=0;k<n;k++){const a=k/n*TAU;this.emit(x+Math.cos(a)*.1,y+Math.sin(a)*.1,0,Math.cos(a)*(4+r*4),Math.sin(a)*(4+r*4),0,.7,.06)}}

function drawHud(t){

  const col=PALS[S.palette].ui;hctx.strokeStyle=col;hctx.lineWidth=1.5;hctx.lineCap='round';
  const sel=S.select==='all'?null:SEL;

    const c=Math.cos(l.frz),s=Math.sin(l.frz),w=l.hx+.18,h=l.hy+.18,cs=[[-w,-h],[w,-h],[w,h],[-w,h]].map(([x,y])=>projectLocal(l.fx+x*c-y*s,l.fy+x*s+y*c,l.fz));
    hctx.globalAlpha=alpha;

      const a=cs[i],b=cs[(i+1)%4],d=cs[(i+3)%4],L=9;
      const ux=b.x-a.x,uy=b.y-a.y,ul=Math.hypot(ux,uy)||1,vx=d.x-a.x,vy=d.y-a.y,vl=Math.hypot(vx,vy)||1;

    if(x1>x0){x0-=14;y0-=14;x1+=14;y1+=14;hctx.globalAlpha=.7;const L=14;
      for(const[x,y,sx,sy]of[[x0,y0,1,1],[x1,y0,-1,1],[x1,y1,-1,-1],[x0,y1,1,-1]]){hctx.beginPath();hctx.moveTo(x+sx*L,y);hctx.lineTo(x,y);hctx.lineTo(x,y+sy*L);hctx.stroke()}}
  }

    const p=projectLocal(PTR.x,PTR.y,0);

const Seq={q:[],t:0,

  update(dt){this.t+=dt;for(let i=0;i<this.q.length;){const e=this.q[i];if(e.at<=this.t){this.q.splice(i,1);try{e.fn()}catch(err){console.error(err)}}else i++}},

/* ---- persistent kinetic overlays + hero bend ---- */
function applyOverlays(t,dt){
  const M=S.motion,calm=S.calm?.5:1;
  for(let i=0;i<letters.length;i++){
    const l=letters[i];
    if(l.flipT===undefined){l.flipT=1;l.flipD=0;l.flipBase=0}
    l.ox=l.oy=l.oz=l.orz=l.orx=l.ory=0;l.osx=l.osy=1;const u=l.fs*.2*calm;
    if(M.wave){const w=Math.sin(t*4-i*.55);l.oy+=w*u*M.wave;l.orz+=w*.12*M.wave*calm;l.oz+=Math.cos(t*4-i*.55)*u*.5*M.wave}
    if(M.bounce){const b=Math.abs(Math.sin(t*3.2+i*1.3));l.oy+=b*u*1.4*M.bounce;l.osy*=1+(1-b)*.12*M.bounce;l.osx*=1-(1-b)*.06*M.bounce}
    if(M.spin&&!S.calm)l.orz+=t*(1.2+(i%3)*.7)*(i%2?1:-1)*M.spin;
    if(M.stretch){const d=Math.hypot(l.x-PTR.x,l.y-PTR.y),f=Math.exp(-d*.35);l.osx*=1+Math.min(1.2,Math.abs(PTR.vx)*.035*f)*M.stretch;l.osy*=1+Math.min(1.2,Math.abs(PTR.vy)*.035*f)*M.stretch}

    const fe=EASE.io(l.flipT);l.ory+=l.flipBase+fe*TAU;l.oz+=Math.sin(fe*Math.PI)*l.fs*.35;
    if(M.melt){l.meltTarget=.5+.35*Math.sin(t*.5+i*.9)*calm;l.mm=true}else if(l.mm){l.meltTarget=0;l.mm=false}
    if(l.grabbed){const sp=Math.hypot(l.vx,l.vy);l.osx*=1.07+Math.min(.12,sp*.004);l.osy*=1.07-Math.min(.05,sp*.002)}
    else if(PTR.present&&!PTR.down&&(S.physics==='still'||S.physics==='repulse')&&!Fx.phase){
      const dx=l.x-PTR.x,dy=l.y-PTR.y,d=Math.hypot(dx,dy);

/* ---- BREAK -> PARTICLES -> REBUILD ---- */
function breakAll(){
  if(Fx.breaking||PLAY.active||cinemaOn&&!Reel.running&&!Demo.on)return;
  if(PT.mode!=='off'&&Fx.broken)return;
  Fx.breaking=true;Fx.broken=true;Fx.rebuilding=false;Seq.clear('brk');Seq.clear('rb');
  const[cx,cy]=centroid();Fx.phase='sep';logEvent('BREAK');Snd.tone&&Snd.impact(.5);CAM.goalDist=Math.min(CAM.goalDist,.92);
  const k=S.calm?.6:1;
  Seq.after(.55*k,()=>{Fx.phase='float'},'brk');
  Seq.after(1.1*k,()=>{
    Fx.phase='free';
    for(const l of letters){const dx=l.x-cx,dy=l.y-cy,d=Math.hypot(dx,dy)+.3;l.vx+=dx/d*rr(6,12);l.vy+=dy/d*rr(6,12)+2;l.wz+=rr(-7,7)}
    PT.enter();PT.explode(S.calm?5:9,cx,cy);SP.burst(cx,cy,60,10);SP.ring(cx,cy,1.6);CAM.shake+=.9;Snd.impact(1.8);Snd.shatter();
  },'brk');
  Seq.after(1.6*k,()=>{Fx.breaking=false},'brk');

function rebuildAll(){
  if(PLAY.active||Fx.rebuilding)return;

  letters.forEach((l,i)=>{l.rbAt=Fx.clock+i*.06});
  PT.onRebuilt=()=>{Fx.phase=null;Fx.broken=false;Fx.rebuilding=false;Fx.breaking=false;SP.ring(0,0,1.4)};

  const f=FONT[S.font],w=effWeight(f,S.weight);await ensureFont(f,w);
  setText(a,{reset:true});resetScene();await new Promise(r=>setTimeout(r,60));

    S.text=b;relayout({reset:true});

/* ---- tiny GIF encoder: median-cut palette + ordered dither + LZW ---- */
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function medianCut(frames){
  const hist=new Uint32Array(32768);
  for(const f of frames)for(let i=0;i<f.length;i+=28)hist[(f[i]>>3)<<10|(f[i+1]>>3)<<5|(f[i+2]>>3)]++;
  const cols=[];for(let k=0;k<32768;k++)if(hist[k])cols.push(k);
  const ch=(k,c)=>c===0?k>>10:c===1?(k>>5)&31:k&31;
  const rng=b=>{let lo=[31,31,31],hi=[0,0,0];for(const k of b){for(let c=0;c<3;c++){const v=ch(k,c);if(v<lo[c])lo[c]=v;if(v>hi[c])hi[c]=v}}return[hi[0]-lo[0],hi[1]-lo[1],hi[2]-lo[2]]};
  let boxes=[cols];
  while(boxes.length<256){
    let bi=-1,best=0,bc=0;
    boxes.forEach((b,i)=>{if(b.length<2)return;const r=rng(b),m=Math.max(r[0],r[1],r[2]);if(m>best){best=m;bi=i;bc=r.indexOf(m)}});
    if(bi<0)break;
    const b=boxes[bi];b.sort((x,y)=>ch(x,bc)-ch(y,bc));
    let tot=0;for(const k of b)tot+=hist[k];let acc=0,si=0;for(;si<b.length-1;si++){acc+=hist[b[si]];if(acc>=tot/2)break}
    boxes.splice(bi,1,b.slice(0,si+1),b.slice(si+1));
  }
  const pal=new Uint8Array(768);
  boxes.forEach((b,i)=>{let r=0,g=0,bl=0,t=0;for(const k of b){const n=hist[k];r+=(k>>10)*n;g+=((k>>5)&31)*n;bl+=(k&31)*n;t+=n}if(t){pal[i*3]=Math.min(255,(r/t)*8+4);pal[i*3+1]=Math.min(255,(g/t)*8+4);pal[i*3+2]=Math.min(255,(bl/t)*8+4)}});
  return pal;
}
function lzwEncode(px,minCode){
  const clear=1<<minCode,eoi=clear+1,out=[];let size=minCode+1,next=eoi+1,cur=0,bits=0,dict=new Map();
  const emit=c=>{cur|=c<<bits;bits+=size;while(bits>=8){out.push(cur&255);cur>>=8;bits-=8}};
  emit(clear);let pre=px[0];
  for(let i=1;i<px.length;i++){
    const k=px[i],key=(pre<<8)|k,v=dict.get(key);
    if(v!==undefined){pre=v;continue}
    emit(pre);
    if(next===4096){emit(clear);dict=new Map();next=eoi+1;size=minCode+1}
    else{if(next>=(1<<size))size++;dict.set(key,next++)}
    pre=k;
  }
  emit(pre);emit(eoi);if(bits>0)out.push(cur&255);
  return out;
}

  for(let fi=0;fi<frames.length;fi++){
    const f=frames[fi],px=new Uint8Array(w*h);

  }

  return new Blob([Uint8Array.from(out)],{type:'image/gif'});
}

/* ===================== PROJECT STORAGE (IndexedDB, no account) ===================== */
const IDB={db:null,
  open(){
    if(this.db)return Promise.resolve(this.db);
    return new Promise((res,rej)=>{
      let r;try{r=indexedDB.open('typecraft',1)}catch(e){rej(e);return}
      r.onupgradeneeded=()=>r.result.createObjectStore('projects',{keyPath:'id'});
      r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error);
    });
  },
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('projects',mode),st=t.objectStore('projects'),rq=fn(st);t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  put(p){return this.tx('readwrite',s=>s.put(p))},
  get(id){return this.tx('readonly',s=>s.get(id))},
  del(id){return this.tx('readwrite',s=>s.delete(id))},
  list(){return this.tx('readonly',s=>s.getAll())},
};

function slider(label,min,max,step,get,set,fmt,dis){
  const w=el('label','sl'),out=el('output'),inp=document.createElement('input');
  inp.type='range';inp.min=min;inp.max=max;inp.step=step;inp.value=get();inp.setAttribute('aria-label',label);
  const show=()=>{out.textContent=fmt?fmt(+inp.value):(+inp.value).toFixed(2)};show();
  inp.addEventListener('input',()=>{set(+inp.value);show()});
  w.append(el('span','',label),out,inp);if(dis){inp.disabled=true;w.style.opacity=.4}
  return w;
}

function setQuality(q){
  if(S.quality===q&&GEO.layers===Q[q].layers&&glyphRes===Q[q].res)return;
  S.quality=q;glyphRes=Q[q].res;SH.on=Q[q].shadow;
  if(PLAY.active)stopPlayback();
  resetScene();clearGlyphs();ensureGeo();initSystems();layoutViewport();relayout();
  for(const l of letters)l.refreshMaterial();toast('Quality: '+q);
}

let lastTL='';
function syncUI(){
  for(const[id]of TABS)dockBtn[id]&&dockBtn[id].classList.toggle('on',openTab===id);
  $$('#tools button[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===S.tool));
  $$('#tools button[data-sel]').forEach(b=>b.classList.toggle('on',b.dataset.sel===S.select));
  if(dockBtn.rec){dockBtn.rec.classList.toggle('live',REC.on);}
  if(dockBtn.break){dockBtn.break.disabled=Fx.breaking||PLAY.active;dockBtn.rebuild.disabled=Fx.rebuilding||PLAY.active}
  const snd=$('#btnSound');snd.textContent=S.sound?'🔊 Sound on':'🔇 Sound off';snd.setAttribute('aria-pressed',S.sound?'true':'false');
  $('#tlPlay').textContent=PLAY.active&&!PLAY.paused?'⏸':'▶';$('#tlLoop').classList.toggle('on',PLAY.loop);$('#tlLoop').setAttribute('aria-pressed',PLAY.loop?'true':'false');
  $('#tlSpeed').textContent=(PLAY.speed===.25?'¼':PLAY.speed===.5?'½':PLAY.speed)+'×';$('#tlRev').classList.toggle('on',PLAY.active&&PLAY.dir<0&&!PLAY.paused);
  $('#tl').classList.toggle('on',!!TAKE||REC.on);

let marksKey='';
function renderMarks(){
  const key=TAKE?TAKE.dur+'|'+TAKE.events.length:'';if(key===marksKey)return;marksKey=key;
  const m=$('#marks');m.innerHTML='';if(!TAKE)return;
  for(const e of TAKE.events){const i=el('i');i.style.left=(e.t/TAKE.dur*100)+'%';i.title=e.label;m.append(i)}

function updateTimeline(){
  let txt,val=null;
  if(REC.on){txt='● '+fmtT(REC.t)+' / '+MAXREC+'s';dockBtn.rec.innerHTML='<i class="dot"></i>Stop '+fmtT(REC.t)+'s'}
  else{
    if(dockBtn.rec&&dockBtn.rec.textContent.indexOf('Stop')===0)dockBtn.rec.innerHTML='<i class="dot"></i>Record';
    if(TAKE){const t=PLAY.active?PLAY.t:0;txt=fmtT(t)+' / '+fmtT(TAKE.dur)+'s';val=Math.round(t/TAKE.dur*1000)}
  }
  const key=txt+'|'+val;if(key===lastTL||txt===undefined)return;lastTL=key;
  $('#tcode').textContent=txt;if(val!==null&&document.activeElement!==$('#scrub'))$('#scrub').value=val;
  $('#scrub').disabled=REC.on;
}
$('#scrub').addEventListener('input',async e=>{

async function loadCustomFontFile(file){
  if(!file)return;
  try{
    const buffer=await file.arrayBuffer();
    const cleanName=file.name.replace(/\.[^/.]+$/,"").replace(/[^a-zA-Z0-9_\-\s]/g,"").trim().slice(0,16)||'Custom';
    const fam='CustomFont_'+Date.now();
    const face=new FontFace(fam,buffer);
    await face.load();
    document.fonts.add(face);
    const id='cust_'+Date.now();
    const entry={id,name:'✦ '+cleanName,fam,cat:'Custom',vf:false,w0:400,custom:true};
    FONTS.unshift(entry);
    FONT[id]=entry;
    S.font=id;
    await refont();
    renderPanel();
    toast('Custom font loaded: '+cleanName);
  }catch(e){console.error('Custom font error:',e);toast('Failed to load font file')}
}

async function loadCustomAudioFile(file){
  if(!file)return;
  const name=await Snd.loadMusic(file);
  if(name){
    const btn=$('#btnMusic');
    if(btn){btn.classList.add('on');btn.innerHTML='🎵 '+name.slice(0,10);btn.setAttribute('aria-pressed','true')}
    toast('Beat track synced: '+name);
  }
}

window.addEventListener('dragover',e=>{e.preventDefault()});
window.addEventListener('drop',e=>{
  e.preventDefault();
  if(!e.dataTransfer||!e.dataTransfer.files||!e.dataTransfer.files.length)return;
  const file=e.dataTransfer.files[0];
  const ext=file.name.split('.').pop().toLowerCase();
  if(['ttf','otf','woff','woff2'].includes(ext))loadCustomFontFile(file);
  else if(['mp3','wav','ogg','m4a','flac','aac'].includes(ext))loadCustomAudioFile(file);
});

  mk('Frame',[['9:16','9:16 · Reel'],['16:9','16:9 · Wide'],['1:1','1:1 · Square']],'aspect');

    mk('Length',[[3,'3 s'],[5,'5 s'],[10,'10 s'],[15,'15 s']],'dur');
    mk('Source',[['auto',TAKE?'Your take':'Auto reel'],['reel','Auto reel']].concat(TAKE?[['take','Your take']]:[]).filter((x,i,a)=>a.findIndex(y=>y[0]===x[0])===i),'src');

function showExportResult(blob,name,o){

  sv.onclick=()=>saveFile(blob,name);cl.onclick=()=>{closeModals();URL.revokeObjectURL(url)};row.append(sv,cl);c.append(row);

  if(!items.length&&!list.children.length)list.append(el('p','note','No saved projects yet. Everything stays in this browser, no account needed.'));
  for(const p of items){
    const r=el('div','pitem');
    if(p.thumb){const i=document.createElement('img');i.src=p.thumb;i.alt='';i.style.cssText='width:54px;height:36px;object-fit:cover;border-radius:6px;margin:0';r.append(i)}

    lo.onclick=async()=>{closeModals();await loadProject(p.id)};de.onclick=async()=>{await IDB.del(p.id);openProjects()};r.append(lo,de);list.append(r);
  }

  const row=el('div','row'),sv=el('button','btn acc','Save project'),nw=el('button','btn','New project'),cl=el('button','btn','Close');
  sv.onclick=async()=>{await saveProject(nm.value);openProjects()};nw.onclick=async()=>{closeModals();await newProject()};cl.onclick=closeModals;

/* ===================== MAIN LOOP ===================== */
const LC={x:0,y:3};
let lastT=performance.now(),lastRaw=performance.now(),acc=0,fpsN=0,fpsT=0,autoQ=true,frameNo=0,lowN=0,okN=0;
const tagline=$('#tagline');
function update(dt){
  G.uTime.value+=dt;
  const playing=PLAY.active&&TAKE;
  if(cinemaOn){Cin.t+=dt;const p=clamp(Cin.t/Cin.dur,0,1);CAM.extraDist=1-.14*EASE.io(p);CAM.extraAz=Math.sin(p*Math.PI)*.16*(S.calm?.3:1)}
  if(playing){
    playbackStep(dt);
    if(Exp.busy&&Exp.sigTail&&S.sig){const rem=Exp.dur-(performance.now()-Exp.t0)/1000;sigMat.opacity=clamp((1.4-rem)/.5,0,1)*.85}
    else if(!S.sig)sigMat.opacity=0;
    SP.update(dt);DU.update(dt,G.uTime.value);
  }else{
    Seq.update(dt);Fx.clock+=dt;
    updatePointer(dt);
    Fx.springBoost+=(1-Fx.springBoost)*(1-Math.exp(-dt*1.2));
    applySculpt(dt);
    applyOverlays(Fx.clock,dt);
    updateBounds();
    acc+=dt;let n=0;while(acc>=1/120&&n<6){stepPhysics(1/120,Fx.clock);acc-=1/120;n++}if(n>=6)acc=0;
    const bp=Snd.getBeatPulse();
    if(bp>.04){CAM.shake+=bp*.03;for(const l of letters)if(!l.hidden&&!l.broken)l.vz+=bp*.5}
    for(const l of letters)l.updateVisual(dt);
    stepShards(dt);
    for(const l of letters)if(MATS[l.mat]==='smoke'&&!l.hidden&&l.dissolve<.5&&Math.random()<dt*22)SP.emitSmoke(l.fx+rr(-l.hx,l.hx),l.fy+rr(-l.hy,l.hy));
    SP.update(dt);DU.update(dt,Fx.clock);PT.update(dt,Fx.clock);
    updateCamera(dt,Fx.clock,PTR);
    const kx=1-Math.exp(-dt*5),hero=Fx.hero&&PTR.present;
    const tx=S.rotX+(hero?-PTR.ny*.16:0),ty=S.rotY+(hero?PTR.nx*.24:0);
    group.rotation.x+=(tx-group.rotation.x)*kx;group.rotation.y+=(ty-group.rotation.y)*kx;group.rotation.z+=(S.rotZ-group.rotation.z)*kx;
    const lx=PTR.present?PTR.x:0,ly=PTR.present?PTR.y:3.5;LC.x+=(lx-LC.x)*(1-Math.exp(-dt*9));LC.y+=(ly-LC.y)*(1-Math.exp(-dt*9));
    group.updateMatrixWorld();
    updateLights(LC.x,LC.y,S.cursorLight);
    const neon=letters.some(l=>l.mat===8&&!l.hidden);
    bgMat.uniforms.uAlpha.value+=((neon?.2:1)-bgMat.uniforms.uAlpha.value)*.35;
    const st=Fx.sigOn&&S.sig?.85:0;sigMat.opacity+=(st-sigMat.opacity)*(1-Math.exp(-dt*4));
  }
  if(playing)group.updateMatrixWorld();
  // shared look
  bgMat.uniforms.uCur.value.set(clamp(LC.x/V.W+.5,0,1),clamp(LC.y/V.H+.5,0,1));bgMat.uniforms.uCurI.value=S.cursorLight?1:0;
  postMat.uniforms.uGrain.value=(cinemaOn?Math.max(S.grain,.12):S.grain)*(S.calm?.5:1);postMat.uniforms.uVig.value=cinemaOn?.55:.3;
  if(REC.on){REC.t+=dt;captureFrame();if(REC.t>=MAXREC){recStop();toast('Reached the '+MAXREC+' s limit')}}
  if(mode==='landing')tagline.style.setProperty('--spread',clamp(PTR.speed/40,0,1).toFixed(2));
  updateTimeline();updateTag();
}
function render(){
  const s=canvas.height/(2*Math.tan(camera.fov*Math.PI/360));
  for(const c of CLOUDS)c.mat.uniforms.uScale.value=s;
  renderer.render(bgScene,ortho);renderer.clearDepth();renderer.render(scene,camera);renderer.render(postScene,ortho);
  drawHud();
}
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,Math.max(.001,(now-lastT)/1000));lastT=now;frameNo++;
  try{update(dt);render()}catch(e){if(frameNo<400)console.error(e)}
  if(autoQ&&frameNo>150&&!document.hidden&&mode==='studio'){fpsN++;fpsT+=(now-lastRaw)/1000;if(fpsT>3){const fps=fpsN/fpsT;fpsN=0;fpsT=0;if(fps<34&&S.quality!=='performance'&&!Exp.busy&&!PLAY.active&&!REC.on){if(++lowN>=2){lowN=0;setQuality(S.quality==='high'?'balanced':'performance')}}else{lowN=0;if(++okN>6)autoQ=false}}}
  lastRaw=now;
}
window.addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(()=>{if(V.exp)return;layoutViewport();relayout()},120)});
async function init(){
  const mobile=isTouch||innerWidth<700,cores=navigator.hardwareConcurrency||4;
  S.quality=mobile&&cores<=6?'performance':mobile?'balanced':(cores>=8&&(devicePixelRatio||1)<=2?'high':'balanced');
  glyphRes=Q[S.quality].res;SH.on=Q[S.quality].shadow;ensureGeo();
  layoutViewport();initSystems();applyPalette();buildDock();syncUI();

  await enterHero();
  const f=FONT[S.font];void f;
}

  api:{breakAll,rebuildAll,setPhysics,setMaterial,setPalette,setTool,recStart,recStop,startPlayback,stopPlayback,runReel,enterCinema,exitCinema,surprise,remix,morphWords,explode,doImpact,toggleParticles,applyPreset,toggleMotion,shatterAll,enterStudio,runDemo,tlToggle,tlReverse,seekTo,runExport,saveProject,loadProject,breakLetter,rebuildLetter,relayout,setQuality,TPRESETS,CURATED,resetScene,flipAll,scatterRebuild,glyphContours,openExport,openProjects,renderPanel,togglePanel,layoutViewport}};
